<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Burger &amp; Beers — QR Menu Demo</title>
<style>
:root{
  --bg:#0E0C0A; --card:#17140F; --card2:#1F1B15; --line:#2B251D;
  --tx:#F4EFE6; --dim:#9C9184; --dim2:#6E655B;
  --amber:#E8A33D; --red:#C64B3C; --green:#2E6B4F; --blue:#3A6B8C;
  --brown:#8A5A2B; --purple:#6B4E8C;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#080706; color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
}
#app{
  width:100%; max-width:480px; min-width:0; margin:0 auto; background:var(--bg);
  min-height:100vh; position:relative; padding-bottom:170px; box-shadow:0 0 60px rgba(0,0,0,.6);
}
@media(min-width:900px){ #app{ border-left:1px solid #241E17; border-right:1px solid #241E17 } }

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(14,12,10,.96);backdrop-filter:blur(12px);
     border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;gap:8px}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700;letter-spacing:-.4px;line-height:1}
.brand small{display:block;font-family:inherit;font-size:8.5px;letter-spacing:2.4px;color:var(--dim2);
             font-weight:400;margin-top:3px}
.topright{display:flex;align-items:center;gap:6px}
.table-pill{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 10px;
            font-size:11px;font-weight:700;color:var(--dim);white-space:nowrap}
.langbtn{display:flex;align-items:center;gap:5px;background:var(--amber);color:#0E0C0A;border:0;
         border-radius:20px;padding:6px 11px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.globe{width:12px;height:12px;border-radius:50%;border:1.6px solid #0E0C0A;position:relative;flex:none}
.globe::after{content:"";position:absolute;left:50%;top:-1.6px;bottom:-1.6px;border-left:1.6px solid #0E0C0A}

/* blocks */
.langs{display:flex;gap:5px;padding:0 14px 9px;overflow-x:auto;scrollbar-width:none;min-width:0}
.langs::-webkit-scrollbar{display:none}
.lg{font-size:10.5px;font-weight:800;letter-spacing:1px;padding:6px 11px;border-radius:7px;
    border:1px solid var(--line);color:var(--dim2);background:transparent;cursor:pointer;
    white-space:nowrap;font-family:inherit;transition:.15s}
.lg.on{background:var(--tx);color:#0E0C0A;border-color:var(--tx)}
.lg.alt{border-style:dashed;color:var(--dim2)}
.lg.alt.on{background:var(--card2);color:var(--amber);border-color:var(--amber);border-style:solid}
.blocks{display:flex;gap:5px;padding:2px 14px 10px;overflow-x:auto;scrollbar-width:none;min-width:0}
.blocks::-webkit-scrollbar{display:none}
.blk{flex:1;min-width:78px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.3px;
     padding:9px 6px;border-radius:9px;background:var(--card2);color:var(--dim);cursor:pointer;
     border:1px solid transparent;transition:.15s;white-space:nowrap}
.blk.on{background:var(--tx);color:#0E0C0A}

/* search + filters */
.tools{padding:0 14px 10px}
.search{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;
        padding:10px 12px;color:var(--tx);font-size:14px;font-family:inherit}
.search::placeholder{color:var(--dim2)}
.filters{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.flt{font-size:11px;font-weight:700;padding:6px 11px;border-radius:20px;border:1px solid var(--line);
     color:var(--dim);background:transparent;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s}
.flt.on{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- language sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
       background:var(--card);border-radius:18px 18px 0 0;z-index:91;padding:16px 16px 24px;
       display:none;border-top:1px solid var(--line);max-height:80vh;overflow:auto}
.sheet.open{display:block}
.sheet h3{font-family:Georgia,serif;font-size:17px;margin-bottom:3px}
.sheet p.sh{color:var(--dim);font-size:12.5px;margin-bottom:12px}
.langrow{display:flex;align-items:center;justify-content:space-between;padding:12px 12px;
         background:var(--card2);border-radius:10px;margin-bottom:7px;cursor:pointer;border:1px solid transparent}
.langrow.on{border-color:var(--amber)}
.langrow b{font-size:14.5px}
.langrow span{color:var(--dim2);font-size:11.5px;display:block;margin-top:1px}
.langrow .ck{color:var(--amber);font-weight:800}
.soon{background:#241D14;border:1px dashed #453722;border-radius:10px;padding:12px;margin-top:10px}
.soon b{color:var(--amber);font-size:13px}
.soon p{color:var(--dim);font-size:11.5px;margin-top:4px;line-height:1.45}

/* ---------- sections & items ---------- */
.sec{padding:16px 14px 4px}
.sec h2{font-family:Georgia,serif;font-size:19px;color:var(--amber);letter-spacing:-.2px}
.sec .sh2{color:var(--dim2);font-size:10.5px;letter-spacing:1.4px;margin-top:2px;text-transform:uppercase}
.hairline{height:1px;background:var(--line);margin:9px 14px 0}

.item{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid #141109;align-items:flex-start}
.thumb{width:60px;height:60px;border-radius:10px;flex:none;position:relative;overflow:hidden}
.thumb::after{content:attr(data-ph);position:absolute;left:0;right:0;bottom:3px;text-align:center;
              font-size:6.5px;letter-spacing:.6px;color:rgba(0,0,0,.4);font-weight:800}
.thumb.photo{background:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:4px}
.thumb.photo::after{content:none}
.thumb.photo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.ib{flex:1;min-width:0}
.iname{font-size:15px;font-weight:700;line-height:1.25}
.idesc{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.35}
.ialt{font-size:11px;color:var(--dim2);margin-top:3px;line-height:1.3}
.ialt b{color:#5C544B;font-size:8.5px;letter-spacing:.8px;margin-right:3px}
.ialg{font-size:10px;color:#5C544B;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:8.5px;font-weight:800;letter-spacing:.4px;padding:3px 7px;border-radius:20px;color:#fff}
.t-veg{background:var(--green)}.t-vgn{background:#1F5B3E}.t-fsh{background:var(--blue)}
.t-nop{background:var(--brown)}.t-glf{background:var(--purple)}.t-spy{background:var(--red)}
.t-loc{background:var(--amber);color:#0E0C0A}.t-new{background:var(--red)}.t-hus{background:#8C6A1F}
.iright{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.price{font-family:Georgia,serif;font-size:15px;font-weight:700;color:var(--amber);white-space:nowrap}
.add{width:31px;height:31px;border-radius:50%;border:1.5px solid var(--amber);background:transparent;
     color:var(--amber);font-size:19px;line-height:0;cursor:pointer;font-family:inherit;
     display:flex;align-items:center;justify-content:center;padding-bottom:2px}
.add:active{background:var(--amber);color:#0E0C0A}
.qty{display:flex;align-items:center;gap:9px}
.qty button{width:26px;height:26px;border-radius:50%;border:0;background:var(--card2);color:var(--tx);
            font-size:16px;line-height:0;cursor:pointer;font-family:inherit}
.qty b{font-size:14px;min-width:14px;text-align:center}

/* hero banner */
.hero{margin:12px 14px 0;background:#33291D;border-radius:12px;padding:13px 15px}
.hero b{color:var(--amber);font-family:Georgia,serif;font-size:15px}
.hero p{color:#D8CBB6;font-size:12px;margin-top:5px;line-height:1.45}

/* ---------- cart ---------- */
.cartbar{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
         background:var(--amber);color:#0E0C0A;padding:14px 16px;display:none;
         align-items:center;justify-content:space-between;cursor:pointer;z-index:60}
.cartbar.show{display:flex}
.cartbar .cl{font-weight:800;font-size:14px}
.cartbar .cr{font-family:Georgia,serif;font-weight:700;font-size:16px}
.drawer{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
        background:var(--card);border-radius:18px 18px 0 0;z-index:95;padding:16px 16px 22px;
        display:none;max-height:82vh;overflow:auto;border-top:1px solid var(--line)}
.drawer.open{display:block}
.drawer h3{font-family:Georgia,serif;font-size:18px;margin-bottom:12px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;
      border-bottom:1px solid var(--line)}
.crow .cn{font-size:13.5px;font-weight:700}
.crow .cp{font-family:Georgia,serif;color:var(--amber);font-weight:700;font-size:14px;white-space:nowrap}
.total{display:flex;justify-content:space-between;padding:14px 0 4px;font-size:17px;font-weight:800}
.total span:last-child{font-family:Georgia,serif;color:var(--amber)}
.btn{width:100%;background:var(--amber);color:#0E0C0A;border:0;border-radius:11px;padding:14px;
     font-size:15px;font-weight:800;cursor:pointer;margin-top:12px;font-family:inherit}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);margin-top:8px}
.empty{color:var(--dim2);text-align:center;padding:26px 0;font-size:13.5px}

/* toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--green);
       color:#fff;padding:12px 20px;border-radius:24px;font-size:13.5px;font-weight:700;z-index:120;
       opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1}

/* footer note */
.fnote{padding:22px 16px 30px;color:#4E473F;font-size:10.5px;line-height:1.5;border-top:1px solid var(--line);margin-top:18px}
.fnote b{color:var(--dim2)}
/* ---- demo bar / service / qr ---- */
.demobar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:#070605;border-top:1px solid var(--line);display:flex;align-items:center;gap:5px;
  padding:7px 10px;z-index:80}
.dbtn{flex:1;text-align:center;font-size:10px;font-weight:800;letter-spacing:.7px;padding:9px 3px;
  border-radius:7px;background:transparent;color:var(--dim2);border:0;cursor:pointer;font-family:inherit}
.dbtn.on{background:var(--card2);color:var(--tx)}
.dsel{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:7px;
  padding:8px 6px;font-size:11px;font-family:inherit;flex:none}
.acts{display:flex;gap:8px;padding:12px 14px 2px}
.act{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 8px;
  color:var(--tx);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.act:active{border-color:var(--amber);color:var(--amber)}
.pane{padding:16px 14px 10px}
.pane h2{font-family:Georgia,serif;font-size:22px;color:var(--amber);letter-spacing:-.3px}
.pane p.ps{color:var(--dim);font-size:12.5px;margin-top:5px;line-height:1.4}
.fld{margin-top:12px}
.fld label{display:block;font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:var(--amber);margin-bottom:5px}
.fld input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;
  padding:11px 12px;color:var(--tx);font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.hint{font-size:10.5px;color:var(--dim2);margin-top:6px;word-break:break-all}
.hint b{color:var(--dim)}
.qrgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.qrcard{background:#fff;border-radius:10px;padding:12px 8px 10px;text-align:center;color:#0E0C0A}
.qrcard .qc{display:flex;justify-content:center}
.qrcard .qn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:700;margin-top:6px;letter-spacing:1px}
.qrcard .qs{font-size:8px;color:#6E655B;line-height:1.35;margin-top:2px}
.ord{background:var(--card2);border-radius:11px;padding:12px 13px;margin-bottom:9px;border-left:3px solid var(--amber)}
.ord.done{opacity:.45;border-left-color:var(--green)}
.ordh{display:flex;justify-content:space-between;align-items:baseline}
.ordh b{font-size:14px}
.ordh span{font-size:10.5px;color:var(--dim2)}
.ordl{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
.ordf{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.ordf .op{font-family:Georgia,serif;color:var(--amber);font-weight:700;font-size:14px}
.ordf button{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:7px;
  padding:6px 11px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
@media print{
  body{background:#fff}
  .top,.demobar,.cartbar,.demo-badge,#hero,.acts,.fld,.hint,.btn,.fnote,.pane p.ps,.pane h2,.noprint{display:none!important}
  #app{max-width:none;box-shadow:none;background:#fff;padding:0}
  .qrgrid{grid-template-columns:repeat(3,1fr);gap:8mm}
  .qrcard{border:1px solid #ddd;break-inside:avoid}
}
.demo-badge{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:100;background:var(--red);
            color:#fff;font-size:9px;font-weight:800;letter-spacing:1.4px;padding:3px 12px;border-radius:0 0 8px 8px}
</style>

<style>
/* ---- rollelinje, tilkalling, kasse, gjeststatus ---- */
.rolepill{display:flex;align-items:center;gap:6px;flex:none;font-size:9.5px;letter-spacing:1px;
 font-weight:800;color:var(--amber,#E8A33D);border:1px solid #3A3128;border-radius:5px;padding:5px 8px}
.syncdot{width:6px;height:6px;border-radius:50%;background:#7A3B33;flex:none}
.syncdot.on{background:#2E6B4F;box-shadow:0 0 0 3px rgba(46,107,79,.22)}
body.nobar .demobar{display:none!important}
body.nobar .cartbar{bottom:0}
body.nobar .mine{bottom:0}
body.nobar.hasmine .cartbar{bottom:64px}
.callhead{display:flex;align-items:baseline;gap:9px}
.histn{display:inline-block;min-width:20px;text-align:center;background:#2A2118;color:#E8A33D;
 border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700}
.histn.hot{background:#C64B3C;color:#fff}
.call{display:flex;align-items:center;justify-content:space-between;gap:10px;
 background:#241708;border:1px solid #7A4A22;border-radius:10px;padding:12px 13px;margin-bottom:9px}
.call b{font-size:14px;color:#F0C98A;display:block}
.call span{font-size:11.5px;color:#B9976A}
.call button{background:#E8A33D;color:#16130F;border:0;border-radius:7px;
 padding:9px 13px;font:700 12px/1 inherit;cursor:pointer;flex:none}
.kbig{margin-top:16px;background:#1C1813;border:1px solid #2E2921;border-radius:12px;
 padding:16px 17px;display:flex;align-items:baseline;justify-content:space-between}
.kbig span{font-size:12px;color:#9A8F80}
.kbig b{font-family:Georgia,serif;font-size:27px;color:#E8A33D;font-weight:400}
.ktri{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}
.ktri div{background:#1C1813;border:1px solid #2E2921;border-radius:10px;padding:12px 10px;text-align:center}
.ktri b{display:block;font-family:Georgia,serif;font-size:17px;color:#F4EFE6;font-weight:400}
.ktri span{display:block;font-size:10px;color:#7E7466;margin-top:3px}
.krow{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;
 border-bottom:1px solid #221E18;font-size:12.5px;color:#9A8F80}
.krow b{color:#F4EFE6;font-family:Georgia,serif;font-size:14px;font-weight:400;white-space:nowrap}
.retain{font-size:11px;color:#7E7466;margin-top:8px}
.mine{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
 background:#1C1813;border-top:1px solid #E8A33D;padding:11px 16px;display:none;
 align-items:center;justify-content:space-between;gap:10px;cursor:pointer;z-index:58}
.mine.show{display:flex}
.mine .mt{font-size:12.5px;font-weight:700;color:#E8A33D}
.mine .ms{font-size:10.5px;color:#9A8F80;margin-top:2px}
.mine .mr{font-family:Georgia,serif;font-size:14px;color:#F4EFE6;white-space:nowrap}
.mine .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#E8A33D;
 margin-right:5px;vertical-align:1px;animation:blip 1.6s ease-in-out infinite}
.mine.done .dot{background:#2E6B4F;animation:none}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
body.hasmine .cartbar{bottom:118px}
/* ---- tilkallingsknapp med roterende ring ---- */
.acts{align-items:center}
.bell{position:relative;width:88px;height:88px;flex:none;background:none;border:0;padding:0;cursor:pointer}
.bell .ring{position:absolute;inset:0;width:88px;height:88px;animation:spin 22s linear infinite}
.bell .ring text{fill:#E8A33D;font:700 8.6px/1 Helvetica,Arial,sans-serif;letter-spacing:2.1px}
.bell .disc{position:absolute;inset:13px;border-radius:50%;border:1px solid #6B5427;
 background:#1C1813;display:flex;align-items:center;justify-content:center}
.bell .disc svg{width:26px;height:26px;fill:none;stroke:#E8A33D;stroke-width:1.6;
 stroke-linecap:round;stroke-linejoin:round}
.bell.rang .disc svg{animation:swing .7s ease}
.bell.rang::after{content:"";position:absolute;inset:6px;border-radius:50%;
 border:1px solid #E8A33D;animation:pulse .8s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swing{0%,100%{transform:rotate(0)}20%{transform:rotate(15deg)}
 40%{transform:rotate(-13deg)}60%{transform:rotate(9deg)}80%{transform:rotate(-5deg)}}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(1.5);opacity:0}}
@media(prefers-reduced-motion:reduce){.bell .ring{animation:none}.bell.rang .disc svg{animation:none}}
</style>
</head>
<body>

<div id="app">

  <div class="top">
    <div class="row1">
      <div class="brand">Burger &amp; Beers<small>STAVANGER</small></div>
      <div class="topright">
        <div class="table-pill" id="tablePill">Bord 11</div>
      </div>
    </div>
    <div class="langs" id="langs"></div>
    <div class="blocks" id="blocks"></div>
    <div class="tools">
      <input class="search" id="search" placeholder="Search...">
      <div class="filters" id="filters"></div>
    </div>
  </div>

  <div id="hero"></div>
  <div id="list"></div>
  <div class="fnote" id="fnote"></div>
</div>

<div class="demobar" id="demobar"></div>
<div class="cartbar" id="cartbar">
  <span class="cl" id="cartL">0</span>
  <span class="cr" id="cartR">0 kr</span>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =====================================================================
   LANGUAGES — adding one is a data entry job, nothing else changes.
   ===================================================================== */
const LANGS = [
  {c:"en", name:"English",  nat:"English"},
  {c:"no", name:"Norsk",    nat:"Norwegian"},
  {c:"de", name:"Deutsch",  nat:"German"},
  {c:"tr", name:"Türkçe",   nat:"Turkish"}
];

const UI = {
  en:{altTitle:"Show the original",altSub:"Prints the Norwegian text under each dish. Useful when pointing at the menu.",
      tblWord:"tables",guest:"GUEST",waiter:"WAITER",qrv:"QR CODES",qrTitle:"QR codes",qrSub:"Every code opens the menu with its own table number. Print, laminate, put it on the table.",baseUrl:"Menu address",tables:"Number of tables",gen:"Generate QR codes",printS:"Print sheet",scan:"Scan for menu & order",svcTitle:"Live orders",svcSub:"Everything guests send from the tables lands here.",svcEmpty:"No orders yet. Send one from the guest view.",served:"Mark as served",srvDone:"Served",callw:"Call the waiter",bill:"Ask for the bill",called:"The waiter has been notified",billed:"The bill is on its way",offline:"QR codes need an internet connection.",
      search:"Search...",all:"All",veg:"Vegetarian",vgn:"Vegan",nop:"No pork",glf:"Gluten free",
      spy:"Spicy",loc:"Local",blocks:["FOOD","BEER","WINE & BAR","NO ALCOHOL"],
      cart:"Your order",items:"items",item:"item",total:"Total",send:"Send order to the kitchen",
      close:"Keep browsing",empty:"Nothing added yet.",sent:"Order sent to the kitchen",

let lang = "en", block = "food", filters = new Set(), query = "", cart = {}, showAlt = false;
let view = "guest", table = 11, orders = [], orderNo = 0, nTables = 12,
    baseUrl = "https://burgerandbeers.no/meny";
const $ = s => document.querySelector(s);
const t = () => UI[lang];

function money(n){ return n.toLocaleString("nb-NO") + " kr"; }
function nameOf(it){ return typeof it.n === "string" ? it.n : (it.n[lang] || it.n.en); }

function renderLangs(){
  const other = lang !== "no" ? "NO" : "EN";
  $("#langs").innerHTML =
    LANGS.map(l=>`<button class="lg ${l.c===lang?"on":""}" data-lg="${l.c}">${l.name.toUpperCase()}</button>`).join("")
    + `<button class="lg alt ${showAlt?"on":""}" data-more="1">+ ${t().lang.toUpperCase()}</button>`;
  [...document.querySelectorAll("[data-lg]")].forEach(el=>el.onclick=()=>{ lang=el.dataset.lg; render(); });
  $("[data-more]").onclick = openSheet;
}

function renderBlocks(){
  $("#blocks").innerHTML = BLOCKKEYS.map((k,i)=>
    `<div class="blk ${k===block?"on":""}" data-b="${k}">${t().blocks[i]}</div>`).join("");
  [...document.querySelectorAll(".blk")].forEach(el=>el.onclick=()=>{
    block = el.dataset.b; window.scrollTo({top:0}); render();
  });
}

function renderFilters(){
  $("#filters").innerHTML =
    `<button class="flt ${filters.size===0?"on":""}" data-f="__all">${t().all}</button>` +
    FILTERKEYS.map(f=>`<button class="flt ${filters.has(f)?"on":""}" data-f="${f}">${t()[f]}</button>`).join("");
  [...document.querySelectorAll(".flt")].forEach(el=>el.onclick=()=>{
    const f = el.dataset.f;
    if(f==="__all") filters.clear();
    else filters.has(f) ? filters.delete(f) : filters.add(f);
    render();
  });
}

function tagHTML(tg){
  const NAME = {veg:t().veg,vgn:t().vgn,nop:t().nop,glf:t().glf,spy:t().spy,loc:t().loc,
                new:{en:"NEW",no:"NYHET",de:"NEU",tr:"YENİ"}[lang],
                fsh:{en:"FISH",no:"FISK",de:"FISCH",tr:"BALIK"}[lang],
                hus:{en:"HOUSE BEER",no:"HUSETS ØL",de:"HAUSBIER",tr:"EV BİRASI"}[lang]};
  return tg.map(x=>`<span class="tag t-${x}">${(NAME[x]||x).toUpperCase()}</span>`).join("");
}

function matches(it){
  if(it.blk !== block) return false;
  for(const f of filters){ if(!it.tg.includes(f)) return false; }
  if(query){
    const hay = (nameOf(it) + " " + Object.values(it.d).join(" ")).toLowerCase();
    if(!hay.includes(query.toLowerCase())) return false;
  }
  return true;
}

function renderHero(){
  const h = HERO[block][lang];
  $("#hero").innerHTML = `<div class="acts">
      <button class="act" id="callW">${t().callw}</button>
      <button class="act" id="askB">${t().bill}</button>
    </div>
    <div class="hero"><b>${h[0]}</b><p>${h[1]}</p></div>`;
  $("#callW").onclick = ()=>toast(t().called);
  $("#askB").onclick  = ()=>toast(t().billed);
}

function renderList(){
  const shown = MENU.filter(matches);
  let html = "";
  for(const s of SECORDER[block]){
    const items = shown.filter(i=>i.sec===s);
    if(!items.length) continue;
    const [ttl,sub] = SEC[s][lang];
    html += `<div class="sec"><h2>${ttl}</h2>${sub?`<div class="sh2">${sub}</div>`:""}</div><div class="hairline"></div>`;
    for(const it of items){
      const q = cart[it.id]||0;
      const other = lang !== "no" ? "no" : "en";
      const alt = showAlt ? `<div class="ialt"><b>${other.toUpperCase()}</b> ${it.d[other]}</div>` : "";
      const alg = it.alg.length ? `<div class="ialg">${t().allerg}: ${it.alg.map(a=>ALG[a][lang]).join(", ")}</div>` : "";
      html += `<div class="item">
        ${IMG[it.id]
          ? `<div class="thumb photo" style="--fb:${THUMBS[it.th]}"><img src="${CDN}${IMG[it.id]}.jpeg" alt="" loading="lazy" onerror="this.parentElement.classList.remove('photo');this.parentElement.style.background=this.parentElement.style.getPropertyValue('--fb');this.parentElement.dataset.ph='FOTO';this.remove()"></div>`
          : `<div class="thumb" style="background:${THUMBS[it.th]}" data-ph="FOTO"></div>`}
        <div class="ib">
          <div class="iname">${nameOf(it)}</div>
          <div class="idesc">${it.d[lang]}</div>
          ${alt}
          <div class="tags">${tagHTML(it.tg)}</div>
          ${alg}
        </div>
        <div class="iright">
          <div class="price">${money(it.p)}</div>
          ${q ? `<div class="qty"><button data-m="${it.id}">−</button><b>${q}</b><button data-a="${it.id}">+</button></div>`
              : `<button class="add" data-a="${it.id}">+</button>`}
        </div>
      </div>`;
    }
  }
  if(!html) html = `<div class="empty" style="padding:50px 20px">—</div>`;
  $("#list").innerHTML = html;
  [...document.querySelectorAll("[data-a]")].forEach(b=>b.onclick=()=>addItem(b.dataset.a));
  [...document.querySelectorAll("[data-m]")].forEach(b=>b.onclick=()=>removeItem(b.dataset.m));
}

function renderFoot(){
  const txt = {
    en:"Prices in Norwegian kroner. "+t().gfbun+". Allergens are shown on every item and translate with the language. The drink photos are the house's own, pulled from its live Favrit menu. The coloured squares are dishes with no photo yet - on Favrit today, not a single food item has one.",
    no:"Priser i norske kroner. "+t().gfbun+". Allergener vises på hver vare og følger språket. Bildene av drikke er stedets egne, hentet fra den nåværende Favrit-menyen. De fargede firkantene er retter uten bilde - i dag har ingen matrett bilde på Favrit.",
    de:"Preise in norwegischen Kronen. "+t().gfbun+". Allergene sind bei jedem Artikel angegeben und wechseln mit der Sprache. Die Getränkefotos stammen aus der aktuellen Favrit-Karte des Hauses. Die farbigen Flächen sind Gerichte ohne Foto - heute hat auf Favrit kein einziges Gericht eines.",
    tr:"Fiyatlar Norveç kronu cinsindendir. "+t().gfbun+". Alerjenler her üründe görünür ve dille birlikte değişir. İçecek fotoğrafları mekânın kendi Favrit menüsünden geliyor. Renkli kareler ise fotoğrafı olmayan ürünler - bugün Favrit menüsünde hiçbir yemeğin fotoğrafı yok."
  }[lang];
  $("#fnote").innerHTML = `<b>DEMO</b> · ${txt}`;
}

function renderDemoBar(){
  const tabs = [["guest",t().guest],["waiter",t().waiter],["qr",t().qrv]];
  const opts = Array.from({length:nTables},(_,i)=>i+1)
    .map(i=>`<option value="${i}" ${i===table?"selected":""}>${t().table} ${i}</option>`).join("");
  $("#demobar").innerHTML =
    `<span class="dbtn" style="flex:none;color:var(--red);border:1px solid var(--red);padding:5px 7px">DEMO</span>`
    + tabs.map(([k,l])=>`<button class="dbtn ${view===k?"on":""}" data-v="${k}">${l}</button>`).join("")
    + `<select class="dsel" id="tblSel">${opts}</select>`;
  [...document.querySelectorAll("[data-v]")].forEach(b=>b.onclick=()=>{
    view=b.dataset.v; window.scrollTo({top:0}); render();
  });
  $("#tblSel").onchange = e => { table = +e.target.value; render(); };
}

function renderService(){
  const list = orders.length ? orders.slice().reverse().map(o=>`
    <div class="ord ${o.served?"done":""}">
      <div class="ordh"><b>${t().table} ${o.table}</b><span>#${String(o.id).padStart(3,"0")} · ${o.at}</span></div>
      <div class="ordl">${o.lines.map(l=>`${l.q} × ${l.name}`).join("<br>")}</div>
      <div class="ordf"><span class="op">${money(o.total)}</span>
        ${o.served ? `<button disabled>${t().srvDone}</button>`
                   : `<button data-srv="${o.id}">${t().served}</button>`}</div>
    </div>`).join("") : `<div class="empty">${t().svcEmpty}</div>`;
  $("#list").innerHTML = `<div class="pane"><h2>${t().svcTitle}</h2>
    <p class="ps">${t().svcSub}</p><div style="margin-top:14px">${list}</div></div>`;
  [...document.querySelectorAll("[data-srv]")].forEach(b=>b.onclick=()=>{
    const o = orders.find(x=>x.id===+b.dataset.srv); if(o) o.served=true; renderService();
  });
}

function renderQR(){
  $("#list").innerHTML = `<div class="pane">
      <h2>${t().qrTitle} · ${nTables} ${t().tblWord}</h2>
      <p class="ps">${t().qrSub}</p>
      <div class="fld"><label>${t().baseUrl}</label><input id="qUrl" value="${baseUrl}"></div>
      <div class="hint">${t().table} 1 &rarr; <b>${qrLink(1)}</b></div>
      <div class="fld"><label>${t().tables}</label><input id="qN" type="number" min="1" max="60" value="${nTables}"></div>
      <button class="btn" id="qGen">${t().gen}</button>
      <button class="btn ghost noprint" id="qPrint">${t().printS}</button>
      <div class="qrgrid" id="qrgrid"></div>
    </div>`;
  $("#qUrl").onchange = e => { baseUrl = e.target.value.trim(); renderQR(); };
  $("#qN").onchange   = e => { nTables = Math.max(1,Math.min(60,+e.target.value||12)); render(); };
  $("#qGen").onclick  = drawQR;
  $("#qPrint").onclick = () => window.print();
  drawQR();
}

function qrLink(i){ return baseUrl + "?bord=" + i; }

function drawQR(){
  const grid = $("#qrgrid"); if(!grid) return;
  grid.innerHTML = "";
  if(typeof QRCode === "undefined"){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${t().offline}</div>`; return;
  }
  for(let i=1;i<=nTables;i++){
    const card = document.createElement("div");
    card.className = "qrcard";
    const holder = document.createElement("div");
    holder.className = "qc";
    card.appendChild(holder);
    const num = document.createElement("div");
    num.className = "qn"; num.textContent = String(i).padStart(2,"0");
    const sub = document.createElement("div");
    sub.className = "qs"; sub.innerHTML = t().scan + "<br>" + UI.no.scan;
    card.appendChild(num); card.appendChild(sub);
    grid.appendChild(card);
    new QRCode(holder,{text:qrLink(i),width:110,height:110,
      colorDark:"#0E0C0A",colorLight:"#FFFFFF",correctLevel:QRCode.CorrectLevel.M});
  }
}

function render(){
  document.documentElement.lang = lang;
  $("#search").placeholder = t().search;
  $("#tablePill").textContent = t().table + " " + table;
  renderLangs(); renderDemoBar();
  const guest = view === "guest";
  $(".blocks").style.display  = guest ? "" : "none";
  $(".tools").style.display   = guest ? "" : "none";
  $("#hero").style.display    = guest ? "" : "none";
  $("#fnote").style.display   = guest ? "" : "none";
  if(guest){ renderBlocks(); renderFilters(); renderHero(); renderList(); renderFoot(); }
  else if(view === "waiter") renderService();
  else renderQR();
  renderCart();
}

/* ---------------- cart ---------------- */
function addItem(id){
  cart[id] = (cart[id]||0)+1;
  const it = MENU.find(x=>x.id===id);
  toast(nameOf(it) + " " + t().added);
  renderList(); renderCart();
}
function removeItem(id){
  cart[id] = (cart[id]||0)-1;
  if(cart[id]<=0) delete cart[id];
  renderList(); renderCart();
}
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0) }
function cartTotal(){ return Object.entries(cart).reduce((a,[id,q])=>a+MENU.find(x=>x.id===id).p*q,0) }

function renderCart(){
  const c = cartCount();
  const bar = $("#cartbar");
  bar.classList.toggle("show", c>0 && view==="guest");
  $("#cartL").textContent = c + " " + (c===1?t().item:t().items);
  $("#cartR").textContent = money(cartTotal());
}

function openDrawer(){
  const entries = Object.entries(cart);
  let rows = entries.length ? entries.map(([id,q])=>{
    const it = MENU.find(x=>x.id===id);
    return `<div class="crow">
      <div><div class="cn">${nameOf(it)}</div>
        <div class="qty" style="margin-top:6px"><button data-dm="${id}">−</button><b>${q}</b><button data-da="${id}">+</button></div>
      </div>
      <div class="cp">${money(it.p*q)}</div></div>`;
  }).join("") : `<div class="empty">${t().empty}</div>`;

  $("#drawer").innerHTML = `<h3>${t().cart}</h3>${rows}
    <div class="total"><span>${t().total}</span><span>${money(cartTotal())}</span></div>
    <button class="btn" id="sendBtn">${t().send}</button>
    <button class="btn ghost" id="closeBtn">${t().close}</button>`;
  $("#drawer").classList.add("open"); $("#sheetBg").classList.add("open");
  [...document.querySelectorAll("[data-da]")].forEach(b=>b.onclick=()=>{addItem(b.dataset.da);openDrawer()});
  [...document.querySelectorAll("[data-dm]")].forEach(b=>b.onclick=()=>{removeItem(b.dataset.dm);openDrawer()});
  $("#closeBtn").onclick = closeAll;
  $("#sendBtn").onclick = ()=>{
    if(!cartCount()) return;
    const lines = Object.entries(cart).map(([id,q])=>{
      const it = MENU.find(x=>x.id===id); return {name:nameOf(it), q, price:it.p};
    });
    orderNo++;
    const now = new Date();
    orders.push({id:orderNo, table, at:String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),
                 lines, total:cartTotal(), served:false});
    cart = {}; closeAll(); renderList(); renderCart(); toast(t().sent);
  };
}

/* ---------------- language sheet ---------------- */
function openSheet(){
  const rows = LANGS.map(l=>`<div class="langrow ${l.c===lang?"on":""}" data-l="${l.c}">
      <div><b>${l.name}</b><span>${l.nat}</span></div>
      ${l.c===lang?'<span class="ck">✓</span>':""}
    </div>`).join("");
  const soon = {
    en:["Any language can be added","Français, Español, Italiano, Nederlands, Polski — a new language is one text field per item. Prices, photos, labels and allergens are reused automatically."],
    no:["Hvilket som helst språk kan legges til","Français, Español, Italiano, Nederlands, Polski — et nytt språk er ett tekstfelt per vare. Priser, bilder, merkelapper og allergener gjenbrukes automatisk."],
    de:["Jede weitere Sprache lässt sich hinzufügen","Français, Español, Italiano, Nederlands, Polski — eine neue Sprache ist ein Textfeld pro Artikel. Preise, Fotos, Labels und Allergene werden automatisch übernommen."],
    tr:["İstenen her dil eklenebilir","Français, Español, Italiano, Nederlands, Polski — yeni bir dil, ürün başına tek bir metin alanı demek. Fiyatlar, fotoğraflar, etiketler ve alerjenler otomatik olarak korunur."]
  }[lang];
  const other = lang !== "no" ? "NO" : "EN";
  $("#sheet").innerHTML = `<h3>${t().lang}</h3><p class="sh">${t().langsub}</p>${rows}
    <div class="langrow ${showAlt?"on":""}" data-alt="1">
      <div><b>${t().altTitle} (${other})</b><span>${t().altSub}</span></div>
      ${showAlt?'<span class="ck">✓</span>':""}
    </div>
    <div class="soon"><b>${soon[0]}</b><p>${soon[1]}</p></div>`;
  $("[data-alt]").onclick = ()=>{ showAlt = !showAlt; closeAll(); render(); };
  $("#sheet").classList.add("open"); $("#sheetBg").classList.add("open");
  [...document.querySelectorAll("[data-l]")].forEach(el=>el.onclick=()=>{
    lang = el.dataset.l; closeAll(); render();
  });
}

function closeAll(){
  $("#sheet").classList.remove("open");
  $("#drawer").classList.remove("open");
  $("#sheetBg").classList.remove("open");
}

let toastTimer;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("show"), 1600);
}

/* ---------------- wire up ---------------- */

$("#sheetBg").onclick = closeAll;
$("#cartbar").onclick = openDrawer;
$("#search").oninput = e => { query = e.target.value; renderList(); };

// A real QR link carries no language code: let the phone suggest one.
// ?lang=tr also works, so you can send someone straight into a language.
const SP = new URLSearchParams(location.search);
const qp = SP.get("lang");
const qb = SP.get("blk");
if(BLOCKKEYS.includes(qb)) block = qb;
const qt = parseInt(SP.get("bord") || SP.get("table") || "", 10);
if(qt >= 1 && qt <= 60) table = qt;
const qv = SP.get("view");
if(["guest","waiter","qr"].includes(qv)) view = qv;
const nav = (qp || navigator.language || "en").slice(0,2).toLowerCase();
if(LANGS.some(l=>l.c===nav)) lang = nav;

render();
</script>

<script>
/* =====================================================================
   BURGER & BEERS — samme motor som Solsiden
   Bestillinger og tilkallinger går gjennom én åpen kanal, så gjestens
   telefon og kassa ser det samme. Ingen konto, ingen server å drifte.
   Bytt TOPIC til noe eget før dette settes i drift.
   ===================================================================== */
(function(){
  var TOPIC = "burgerandbeers-stavanger-demo";
  var HUB   = "https://ntfy.sh/" + TOPIC;
  var RETENTION_H = 48;
  var LSKEY = "bb.orders.v1", CKEY = "bb.calls.v1";

  /* ---------- ordbok ---------- */
  var WORDS = {
   en:{calls:"Calls",callsSub:"Tables waiting for someone. Acknowledge once you have been there.",
       callsEmpty:"No calls right now.",ackBtn:"Acknowledge",wantsWaiter:"asks for a waiter",
       wantsBill:"asks for the bill",kasse:"TILL",kTitle:"Till",kSub:"Everything sent from the tables today.",
       kToday:"Revenue today",kOrders:"orders",kAvg:"Average per order",kTables:"By table",
       kEmpty:"Nothing registered today.",hist:"History",histSub:"Served in the last {h} hours.",
       histEmpty:"Nothing served yet.",retain:"Orders stay in the list for {h} hours.",
       openOrders:"not served",today:"Today",yday:"Yesterday",mine:"Your order",
       statSent:"sent to the kitchen",statServed:"served",
       roleW:"Waiter",roleA:"Manager",items:"items",item:"item"},
   no:{calls:"Tilkalling",callsSub:"Bord som venter på noen. Kvitter når du har vært der.",
       callsEmpty:"Ingen tilkalling nå.",ackBtn:"Kvitter",wantsWaiter:"ber om servitør",
       wantsBill:"ber om regningen",kasse:"KASSE",kTitle:"Kasse",kSub:"Alt som er sendt fra bordene i dag.",
       kToday:"Omsetning i dag",kOrders:"bestillinger",kAvg:"Snitt per bestilling",kTables:"Per bord",
       kEmpty:"Ingenting registrert i dag.",hist:"Historikk",histSub:"Servert de siste {h} timene.",
       histEmpty:"Ingenting servert ennå.",retain:"Bestillingene blir liggende i {h} timer.",
       openOrders:"ikke servert",today:"I dag",yday:"I går",mine:"Din bestilling",
       statSent:"sendt til kjøkkenet",statServed:"servert",
       roleW:"Servitør",roleA:"Sjef",items:"varer",item:"vare"},
   de:{calls:"Rufe",callsSub:"Tische, die warten. Quittieren Sie, sobald Sie dort waren.",
       callsEmpty:"Gerade keine Rufe.",ackBtn:"Quittieren",wantsWaiter:"ruft den Service",
       wantsBill:"bittet um die Rechnung",kasse:"KASSE",kTitle:"Kasse",kSub:"Alles, was heute von den Tischen kam.",
       kToday:"Umsatz heute",kOrders:"Bestellungen",kAvg:"Durchschnitt pro Bestellung",kTables:"Pro Tisch",
       kEmpty:"Heute noch nichts erfasst.",hist:"Verlauf",histSub:"Serviert in den letzten {h} Stunden.",
       histEmpty:"Noch nichts serviert.",retain:"Bestellungen bleiben {h} Stunden in der Liste.",
       openOrders:"nicht serviert",today:"Heute",yday:"Gestern",mine:"Ihre Bestellung",
       statSent:"an die Küche gesendet",statServed:"serviert",
       roleW:"Service",roleA:"Leitung",items:"Artikel",item:"Artikel"},
   tr:{calls:"Çağrılar",callsSub:"Sizi bekleyen masalar. Gidince İlgilendim'e basın.",
       callsEmpty:"Şu an çağrı yok.",ackBtn:"İlgilendim",wantsWaiter:"garson istiyor",
       wantsBill:"hesap istiyor",kasse:"KASA",kTitle:"Kasa",kSub:"Bugün masalardan gelen her şey.",
       kToday:"Bugünkü ciro",kOrders:"sipariş",kAvg:"Sipariş başına ortalama",kTables:"Masa bazında",
       kEmpty:"Bugün kayıt yok.",hist:"Geçmiş",histSub:"Son {h} saatte servis edilenler.",
       histEmpty:"Henüz servis edilen yok.",retain:"Siparişler listede {h} saat kalır.",
       openOrders:"servis edilmedi",today:"Bugün",yday:"Dün",mine:"Siparişiniz",
       statSent:"mutfağa gönderildi",statServed:"servis edildi",
       roleW:"Garson",roleA:"Yönetici",items:"ürün",item:"ürün"}
  };
  for(var lg in WORDS){ if(UI[lg]) for(var k in WORDS[lg]) UI[lg][k] = WORDS[lg][k]; }

  /* ---------- lagring ---------- */
  function prune(list){
    var cut = Date.now() - RETENTION_H*3600*1000;
    return list.filter(function(o){ return (o.ts||0) > cut; });
  }
  function load(key){ try{ return prune(JSON.parse(localStorage.getItem(key)||"[]")); }catch(e){ return []; } }
  function save(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
  function saveAll(){ save(LSKEY, orders); save(CKEY, calls); }

  function stamp(ts){
    var d=new Date(ts), n=new Date();
    var hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
    var day=function(x){ return x.getFullYear()+"-"+x.getMonth()+"-"+x.getDate(); };
    var y=new Date(n.getTime()-86400000);
    if(day(d)===day(n)) return t().today+" "+hm;
    if(day(d)===day(y)) return t().yday+" "+hm;
    return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+". "+hm;
  }

  /* ---------- synk ---------- */
  var online=false, seen={}, seq=1, es=null;
  window.calls = [];
  function uid(){ return Math.floor(performance.now()*1000).toString(36)+"-"+(seq++).toString(36); }
  function setOnline(v){
    if(online===v) return; online=v;
    var d=document.querySelector("#syncdot"); if(d) d.className="syncdot"+(v?" on":"");
  }
  function publish(e){
    try{ fetch(HUB,{method:"POST",body:JSON.stringify(e)})
      .then(function(){setOnline(true);}).catch(function(){setOnline(false);});
    }catch(err){ setOnline(false); }
  }
  function apply(e){
    if(!e||!e.u||seen[e.u]) return false;
    seen[e.u]=1;
    if(e.k==="order"){
      if(orders.some(function(o){return o.uid===e.u;})) return false;
      orders.push({uid:e.u,id:e.id,table:e.table,ts:e.ts,at:e.at,lines:e.lines,total:e.total,served:false});
      return true;
    }
    if(e.k==="serve"){ var o=orders.find(function(x){return x.uid===e.ref;});
      if(o&&!o.served){o.served=true;return true;} return false; }
    if(e.k==="call"){
      if(calls.some(function(c){return c.uid===e.u;})) return false;
      calls.push({uid:e.u,table:e.table,ts:e.ts,kind:e.kind,done:false}); return true;
    }
    if(e.k==="ack"){ var c=calls.find(function(x){return x.uid===e.ref;});
      if(c&&!c.done){c.done=true;return true;} return false; }
    return false;
  }
  function pull(){
    fetch(HUB+"/json?poll=1&since=12h").then(function(r){ return r.text(); }).then(function(txt){
      var touched=false;
      txt.trim().split(String.fromCharCode(10)).forEach(function(line){
        if(!line) return;
        try{ var m=JSON.parse(line);
          if(m.event!=="message"||!m.message) return;
          if(apply(JSON.parse(m.message))) touched=true;
        }catch(e){}
      });
      setOnline(true);
      if(touched){ saveAll(); render(); }
    }).catch(function(){ setOnline(false); });
  }
  function listen(){
    try{
      if(es) es.close();
      es=new EventSource(HUB+"/sse");
      es.onopen=function(){setOnline(true);};
      es.onerror=function(){setOnline(false);};
      es.onmessage=function(ev){
        try{ var m=JSON.parse(ev.data);
          if(m.event!=="message"||!m.message) return;
          if(apply(JSON.parse(m.message))){ saveAll();
            if(view==="waiter"||view==="kasse") render(); else renderMine(); }
        }catch(e){}
      };
    }catch(e){ setOnline(false); }
  }

  /* ---------- roller ---------- */
  var VIEWS={gjest:["guest"],servit:["waiter"],sjef:["guest","waiter","kasse","qr"]};
  var role="gjest";
  var SP=new URLSearchParams(location.search);
  var pn=(SP.get("panel")||"").toLowerCase();
  if(pn==="garson"||pn==="waiter"||pn==="servitor") role="servit";
  else if(pn==="sef"||pn==="sjef"||pn==="admin"||SP.get("demo")==="1") role="sjef";

  /* ---------- gjestens statuslinje ---------- */
  var mineBox=document.createElement("div");
  mineBox.className="mine"; mineBox.id="mine";
  document.body.appendChild(mineBox);
  window.renderMine=function(){
    var list=prune(orders).filter(function(o){return o.table===table;})
                          .sort(function(a,b){return b.ts-a.ts;});
    var show = view==="guest" && list.length>0;
    mineBox.classList.toggle("show",show);
    document.body.classList.toggle("hasmine",show);
    if(!show){ mineBox.innerHTML=""; return; }
    var open=list.filter(function(o){return !o.served;});
    var o=open[0]||list[0], served=!open.length;
    mineBox.classList.toggle("done",served);
    var n=list.reduce(function(a,x){return a+x.lines.reduce(function(b,l){return b+l.q;},0);},0);
    var sum=list.reduce(function(a,x){return a+x.total;},0);
    mineBox.innerHTML='<div><div class="mt"><span class="dot"></span>'+t().mine+" · "+
      (served?t().statServed:t().statSent)+'</div><div class="ms">'+n+" "+
      (n===1?t().item:t().items)+" · "+stamp(o.ts)+'</div></div><div class="mr">'+money(sum)+"</div>";
  };

  /* ---------- tilkalling ---------- */
  function ring(kind){
    var e={k:"call",u:uid(),table:table,ts:Date.now(),kind:kind};
    apply(e); saveAll(); publish(e);
  }
  var _hero=renderHero;
  window.renderHero=function(){
    _hero();
    var acts=document.querySelector("#hero .acts");
    if(!acts) return;
    var ringtxt=(t().callw+" · ").toUpperCase().repeat(3);
    acts.innerHTML='<button class="bell" id="callW" aria-label="'+t().callw+'">'+
      '<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><defs>'+
      '<path id="bellpath" fill="none" d="M50,50 m-37,0 a37,37 0 1,1 74,0 a37,37 0 1,1 -74,0"></path></defs>'+
      '<text><textPath href="#bellpath" startOffset="0">'+ringtxt+'</textPath></text></svg>'+
      '<span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true">'+
      '<path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path>'+
      '<path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg></span></button>'+
      '<button class="act" id="askB" style="flex:1">'+t().bill+"</button>";
    document.querySelector("#callW").onclick=function(){
      this.classList.remove("rang"); void this.offsetWidth; this.classList.add("rang");
      ring("waiter"); toast(t().called);
    };
    document.querySelector("#askB").onclick=function(){ ring("bill"); toast(t().billed); };
  };

  /* ---------- bestillingen sendes ut ---------- */
  var _open=openDrawer;
  window.openDrawer=function(){
    _open();
    var b=document.querySelector("#sendBtn"); if(!b) return;
    b.onclick=function(){
      if(!cartCount()) return;
      var lines=Object.entries(cart).map(function(p){
        var it=MENU.find(function(x){return x.id===p[0];});
        return {name:nameOf(it),q:p[1],price:it.p};
      });
      orderNo++;
      var now=new Date();
      var e={k:"order",u:uid(),id:orderNo,table:table,ts:Date.now(),
             at:String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),
             lines:lines,total:cartTotal()};
      apply(e); saveAll(); publish(e);
      cart={}; closeAll(); renderList(); renderCart(); renderMine(); toast(t().sent);
    };
  };

  /* ---------- servitørpanel ---------- */
  window.renderService=function(){
    orders=prune(orders); calls=prune(calls); saveAll();
    var newest=function(a,b){return b.ts-a.ts;};
    var card=function(o){ return '<div class="ord '+(o.served?"done":"")+'">'+
      '<div class="ordh"><b>'+t().table+" "+o.table+"</b><span>#"+String(o.id).padStart(3,"0")+
      " · "+stamp(o.ts)+"</span></div>"+
      '<div class="ordl">'+o.lines.map(function(l){return l.q+" × "+l.name;}).join("<br>")+"</div>"+
      '<div class="ordf"><span class="op">'+money(o.total)+"</span>"+
      (o.served?"<button disabled>"+t().srvDone+"</button>"
               :'<button data-srv="'+o.uid+'">'+t().served+"</button>")+"</div></div>"; };
    var active=orders.filter(function(o){return !o.served;}).sort(newest);
    var done  =orders.filter(function(o){return  o.served;}).sort(newest);
    var open  =calls.filter(function(c){return !c.done;}).sort(newest);
    var callCard=function(c){ return '<div class="call"><div><b>'+t().table+" "+c.table+"</b><span>"+
      (c.kind==="bill"?t().wantsBill:t().wantsWaiter)+" · "+stamp(c.ts)+
      '</span></div><button data-ack="'+c.uid+'">'+t().ackBtn+"</button></div>"; };
    document.querySelector("#list").innerHTML='<div class="pane">'+
      '<div class="callhead"><h2>'+t().calls+'</h2><span class="histn '+(open.length?"hot":"")+'">'+
      open.length+"</span></div><p class=\"ps\">"+t().callsSub+"</p>"+
      '<div style="margin-top:12px">'+(open.length?open.map(callCard).join("")
        :'<div class="empty">'+t().callsEmpty+"</div>")+"</div>"+
      '<h2 style="margin-top:26px">'+t().svcTitle+'</h2><p class="ps">'+t().svcSub+"</p>"+
      '<div class="retain">'+t().retain.replace("{h}",RETENTION_H)+
        (active.length?" · "+active.length+" "+t().openOrders:"")+"</div>"+
      '<div style="margin-top:14px">'+(active.length?active.map(card).join("")
        :'<div class="empty">'+t().svcEmpty+"</div>")+"</div>"+
      '<div class="callhead" style="margin-top:26px"><h2>'+t().hist+
        '</h2><span class="histn">'+done.length+"</span></div>"+
      '<p class="ps">'+t().histSub.replace("{h}",RETENTION_H)+"</p>"+
      '<div style="margin-top:12px">'+(done.length?done.map(card).join("")
        :'<div class="empty">'+t().histEmpty+"</div>")+"</div></div>";
    [].forEach.call(document.querySelectorAll("[data-srv]"),function(b){
      b.onclick=function(){
        var o=orders.find(function(x){return x.uid===b.dataset.srv;});
        if(o&&!o.served){ var e={k:"serve",u:uid(),ref:o.uid}; apply(e); saveAll(); publish(e); }
        renderService(); renderMine();
      };
    });
    [].forEach.call(document.querySelectorAll("[data-ack]"),function(b){
      b.onclick=function(){ var e={k:"ack",u:uid(),ref:b.dataset.ack}; apply(e); saveAll(); publish(e); renderService(); };
    });
  };

  /* ---------- kasse ---------- */
  window.renderKasse=function(){
    orders=prune(orders);
    var d0=new Date(); d0.setHours(0,0,0,0);
    var today=orders.filter(function(o){return o.ts>=d0.getTime();}).sort(function(a,b){return b.ts-a.ts;});
    var sum=today.reduce(function(a,o){return a+o.total;},0);
    var avg=today.length?Math.round(sum/today.length):0;
    var byT={}; today.forEach(function(o){ byT[o.table]=(byT[o.table]||0)+o.total; });
    var rows=Object.keys(byT).sort(function(a,b){return byT[b]-byT[a];})
      .map(function(k){return '<div class="krow"><span>'+t().table+" "+k+"</span><b>"+money(byT[k])+"</b></div>";}).join("");
    var lines=today.length?today.map(function(o){
      return '<div class="krow"><span>#'+String(o.id).padStart(3,"0")+" · "+t().table+" "+o.table+
        " · "+stamp(o.ts)+(o.served?"":" · "+t().openOrders)+"</span><b>"+money(o.total)+"</b></div>";}).join("")
      :'<div class="empty">'+t().kEmpty+"</div>";
    document.querySelector("#list").innerHTML='<div class="pane"><h2>'+t().kTitle+
      '</h2><p class="ps">'+t().kSub+"</p>"+
      '<div class="kbig"><span>'+t().kToday+"</span><b>"+money(sum)+"</b></div>"+
      '<div class="ktri"><div><b>'+today.length+"</b><span>"+t().kOrders+"</span></div>"+
      "<div><b>"+money(avg)+"</b><span>"+t().kAvg+"</span></div>"+
      "<div><b>"+Object.keys(byT).length+"</b><span>"+t().tblWord+"</span></div></div>"+
      '<h2 style="margin-top:24px">'+t().kTables+'</h2><div style="margin-top:10px">'+
      (rows||'<div class="empty">'+t().kEmpty+"</div>")+"</div>"+
      '<h2 style="margin-top:24px">'+t().svcTitle+'</h2><div style="margin-top:10px">'+lines+"</div></div>";
  };

  /* ---------- rollelinje ---------- */
  window.renderDemoBar=function(){
    var bar=document.querySelector("#demobar");
    if(role==="gjest"){ bar.style.display="none"; document.body.classList.add("nobar"); return; }
    bar.style.display=""; document.body.classList.remove("nobar");
    var label={guest:t().guest,waiter:t().waiter,kasse:t().kasse,qr:t().qrv};
    var allowed=VIEWS[role];
    var tabs=allowed.map(function(k){
      return '<button class="dbtn '+(view===k?"on":"")+'" data-v="'+k+'">'+label[k]+"</button>";}).join("");
    var opts=Array.from({length:nTables},function(_,i){return i+1;}).map(function(i){
      return '<option value="'+i+'" '+(i===table?"selected":"")+">"+t().table+" "+i+"</option>";}).join("");
    bar.innerHTML='<span class="rolepill"><span class="syncdot'+(online?" on":"")+'" id="syncdot"></span>'+
      (role==="sjef"?t().roleA:t().roleW)+"</span>"+tabs+
      (allowed.indexOf("guest")>=0?'<select class="dsel" id="tblSel">'+opts+"</select>":"");
    [].forEach.call(document.querySelectorAll("[data-v]"),function(b){
      b.onclick=function(){ view=b.dataset.v; window.scrollTo({top:0}); render(); };});
    var sel=document.querySelector("#tblSel");
    if(sel) sel.onchange=function(e){ table=+e.target.value; render(); };
  };

  /* ---------- render-innpakning ---------- */
  var _render=render;
  window.render=function(){
    if(VIEWS[role].indexOf(view)<0) view=VIEWS[role][0];
    if(view==="kasse"){
      document.querySelector("#blocks").style.display="none";
      var tl=document.querySelector(".tools"); if(tl) tl.style.display="none";
      document.querySelector("#hero").style.display="none";
      var fn=document.querySelector("#fnote"); if(fn) fn.style.display="none";
      renderLangs(); renderDemoBar(); renderKasse(); renderCart(); renderMine();
      return;
    }
    _render();
    renderMine();
  };

  /* ---------- QR-adressen er siden selv ---------- */
  try{
    if(location.protocol==="http:"||location.protocol==="https:")
      baseUrl = location.origin + location.pathname;
  }catch(e){}
  window.qrLink=function(i){
    return baseUrl+(baseUrl.indexOf("?")>=0?"&":"?")+"bord="+i+"&lang="+lang;
  };

  /* ---------- oppstart ---------- */
  orders=load(LSKEY); calls=load(CKEY);
  orders.forEach(function(o){ if(o.uid) seen[o.uid]=1; });
  calls .forEach(function(c){ if(c.uid) seen[c.uid]=1; });
  orderNo=orders.reduce(function(m,o){return Math.max(m,o.id||0);},0);
  if(VIEWS[role].indexOf(view)<0) view=VIEWS[role][0];
  render();
  pull(); listen();
  setInterval(function(){ if(!online) pull(); },20000);
})();
</script>
</body>
</html>
