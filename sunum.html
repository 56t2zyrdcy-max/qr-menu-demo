<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOLSIDEN · QR-meny</title>
<meta name="description" content="En gjennomgang av menyen — og et forslag.">
<style>
:root{
  --bg:#07141A; --deep:#0E2029; --card:#112832; --line:#1B333C;
  --brass:#D8B45A; --green:#2F6B57; --red:#B4472F;
  --tx:#E7F0F2; --dim:#9DB4BA; --dim2:#6E858C;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 22px}

/* ---------- språkvelger ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(7,20,26,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:11px 22px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font-family:Georgia,serif;font-size:15px;letter-spacing:4px;color:var(--tx);white-space:nowrap}
.langs{display:flex;gap:6px}
.lg{background:transparent;border:1px solid var(--line);color:var(--dim);
  border-radius:20px;padding:7px 13px;font:700 11px/1 inherit;letter-spacing:.06em;
  cursor:pointer;white-space:nowrap;transition:.15s}
.lg:hover{color:var(--tx);border-color:#2B4A55}
.lg.on{background:var(--brass);border-color:var(--brass);color:#07141A}

/* ---------- hero ---------- */
.hero{padding:64px 0 44px;border-bottom:1px solid var(--line)}
h1{font-family:Georgia,serif;font-weight:400;font-size:44px;line-height:1.1;
  margin:0 0 8px;letter-spacing:5px}
.tag{font-family:Georgia,serif;font-size:23px;color:var(--brass);margin:0 0 20px;line-height:1.3}
.lede{font-size:18px;line-height:1.7;color:var(--dim);margin:0 0 22px}
.meta{font-size:13px;color:var(--dim2)}

/* ---------- seksjoner ---------- */
section{padding:46px 0;border-bottom:1px solid var(--line)}
h2{font-family:Georgia,serif;font-weight:400;font-size:29px;line-height:1.25;margin:0 0 6px}
.kicker{font:700 11px/1 inherit;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim2);margin:0 0 14px}
p{margin:0 0 16px;color:var(--dim)}
p.big{font-size:17.5px;color:#C6D8DC}
strong{color:var(--tx);font-weight:600}

/* ---------- tall ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0 0}
.stats.four{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 14px}
.stat b{display:block;font-family:Georgia,serif;font-size:34px;font-weight:400;color:var(--brass);line-height:1}
.stat.red b{color:var(--red)}
.stat span{display:block;font-size:12px;color:var(--dim2);margin-top:8px;line-height:1.4}

/* ---------- funnliste ---------- */
.finds{margin:22px 0 0;padding:0;list-style:none}
.finds li{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid #14262E}
.finds li:last-child{border-bottom:0}
.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;
  font:700 12px/28px inherit;text-align:center}
.n.a{background:#C08A1E}
.fh{font-weight:600;color:var(--tx);display:block;margin-bottom:3px}
.fd{font-size:14.5px;color:var(--dim2);display:block;line-height:1.55}

/* ---------- sitatboks ---------- */
.quote{background:var(--deep);border:1px solid var(--line);border-radius:14px;
  padding:30px 24px;text-align:center;margin:26px 0}
.quote .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:30px;
  color:var(--brass);letter-spacing:3px;display:block}
.quote .cap{font-size:13px;color:var(--dim2);margin-top:12px;display:block}
.alarm{background:#2A1310;border:1px solid #6B3226;border-radius:12px;
  padding:18px 20px;color:#F0BCAE;font-size:16.5px;line-height:1.6}

/* ---------- tabell ---------- */
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:20px 0 0}
th{background:var(--deep);color:var(--tx);text-align:left;padding:12px 14px;
  font-size:12.5px;font-weight:700;letter-spacing:.04em}
td{padding:12px 14px;border-bottom:1px solid #14262E;color:var(--dim)}
td.no{color:var(--red);font-weight:700}

/* ---------- kort ---------- */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card b{display:block;color:var(--tx);font-size:15.5px;margin-bottom:5px}
.card span{font-size:14px;color:var(--dim2);line-height:1.55}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);
  display:block;margin-bottom:11px}
.dot.br{background:var(--brass)}

/* ---------- steg ---------- */
.steps{margin:22px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:15px;padding:14px 0;border-bottom:1px solid #14262E}
.steps li:last-child{border-bottom:0}
.sn{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--brass);
  color:var(--brass);font:400 14px/28px Georgia,serif;text-align:center}

/* ---------- plan ---------- */
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.pcol{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.ph{display:inline-block;font:700 10px/1 inherit;letter-spacing:.12em;color:#07141A;
  border-radius:20px;padding:7px 12px;margin-bottom:14px}
.pcol ul{margin:0;padding-left:17px;color:var(--dim);font-size:14px;line-height:1.6}
.pcol li{margin-bottom:7px}

/* ---------- lenker ---------- */
.links{display:grid;gap:10px;margin-top:22px}
.lk{display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:17px 20px;text-decoration:none;transition:.15s}
.lk:hover{border-color:var(--brass);background:#153039}
.lk b{color:var(--brass);font-size:16px;font-weight:600}
.lk span{color:var(--dim2);font-size:13px}
.lk .arw{color:var(--brass);font-size:19px;flex:none}

/* ---------- avslutning ---------- */
.end{padding:66px 0 30px;text-align:left}
.end h2{font-size:38px;line-height:1.25;margin-bottom:18px}
.sig{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
  font-size:13.5px;color:var(--dim2)}
.sig b{color:var(--brass);font-weight:600}
.src{font-size:12px;color:#54696F;line-height:1.6;margin-top:24px}

@media (max-width:620px){
  h1{font-size:32px;letter-spacing:3px}
  .tag{font-size:19px}
  .lede{font-size:16.5px}
  h2{font-size:24px}
  .end h2{font-size:28px}
  .stats,.stats.four{grid-template-columns:1fr 1fr}
  .cards,.plan{grid-template-columns:1fr}
  .quote .code{font-size:22px;letter-spacing:2px}
  .mark{font-size:12px;letter-spacing:2px}
  .lg{padding:7px 10px;font-size:10.5px}
  section{padding:38px 0}
}
</style>
</head>
<body>

<div class="top"><div class="topin">

  <div class="langs" id="langs"></div>

/* --------------------------------------------------------------- render */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let lang = (new URLSearchParams(location.search).get("lang") || "").toLowerCase();
if(!T[lang]){
  const nav = (navigator.language || "no").slice(0,2).toLowerCase();
  lang = T[nav] ? nav : "no";
}

function renderLangs(){
  document.getElementById("langs").innerHTML = Object.keys(T).map(c =>
    `<button class="lg ${c===lang?"on":""}" data-l="${c}">${T[c].name}</button>`).join("");
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
    lang = b.dataset.l;
    const u = new URL(location); u.searchParams.set("lang", lang);
    history.replaceState(null, "", u);
    render(); window.scrollTo({top:0});
  });
}

function render(){
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.h1 + " · QR";

  ).join("") + `</div>`;

    `<div class="card"><span class="dot${brass?" br":""}"></span>

  document.getElementById("doc").innerHTML = `
  <div class="wrap">

    <div class="hero">
      <h1>${esc(t.h1)}</h1>

        `<li><span class="n ${f[2]==="a"?"a":""}">${i+1}</span>

      </ul>
    </section>

    <section>
      <p class="kicker">${esc(t.k3)}</p><h2>${esc(t.h3s)}</h2>
      <div class="quote"><span class="code">${esc(t.code)}</span>
        <span class="cap">${esc(t.cap)}</span></div>
      <p class="big">${esc(t.p3)}</p>

      <p>${esc(t.p4)}</p>
      <table><tr>${t.tbl[0].map(h=>`<th>${esc(h)}</th>`).join("")}</tr>
