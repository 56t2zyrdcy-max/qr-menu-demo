<title>SOLSIDEN · QR-meny</title>
<!-- Fjordside og Solsiden er samme hus: Akershusstranda 13, Oslo.
     Den ferdige menyen ligger i solsiden.html. Denne siden sender videre dit,
     slik at QR-koder og lenker som alt er delt ut fortsatt virker.
     Bordnummer og språk følger med. -->
<script>
(function(){
  try{
    var q = location.search || "";
    location.replace("solsiden.html" + q);
  }catch(e){
    location.href = "solsiden.html";
  }
})();
</script>
<meta http-equiv="refresh" content="0; url=solsiden.html">

  a{display:inline-block;background:#D8B45A;color:#07141A;text-decoration:none;
