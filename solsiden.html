<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SOLSIDEN · QR-meny</title>
<style>
:root{--bg:#07141A;--card:#0E2029;--card2:#132A34;--line:#1E3B47;
      --tx:#EEF4F4;--dim:#9DB2B8;--dim2:#6A838C;
      --brass:#D8B45A;--deep:#0A1B22;--red:#C4553F;--green:#2F6B57;--blue:#3E7690}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#040D11;color:var(--tx);
 font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif}
#app{width:100%;max-width:480px;min-width:0;margin:0 auto;background:var(--bg);
 min-height:100vh;position:relative;padding-bottom:170px;box-shadow:0 0 60px rgba(0,0,0,.6)}
@media(min-width:900px){#app{border-left:1px solid #10242D;border-right:1px solid #10242D}}

.top{position:sticky;top:0;z-index:40;background:rgba(7,20,26,.97);backdrop-filter:blur(12px);
 border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 9px;gap:8px}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:400;
 letter-spacing:5px;line-height:1}
.brand small{display:block;font-family:inherit;font-size:8px;letter-spacing:2.6px;
 color:var(--dim2);margin-top:5px;font-style:italic}
.table-pill{background:var(--card2);border:1px solid var(--line);border-radius:20px;
 padding:5px 11px;font-size:11px;font-weight:700;color:var(--dim);white-space:nowrap}

.langs{display:flex;gap:5px;padding:0 14px 9px;overflow-x:auto;scrollbar-width:none;min-width:0}
.langs::-webkit-scrollbar{display:none}
.lg{font-size:10px;font-weight:800;letter-spacing:1px;padding:6px 11px;border-radius:6px;
 border:1px solid var(--line);color:var(--dim2);background:transparent;cursor:pointer;
 white-space:nowrap;font-family:inherit;transition:.15s}
.lg.on{background:var(--brass);color:#07141A;border-color:var(--brass)}
.lg.alt{border-style:dashed}

.blocks{display:flex;gap:5px;padding:2px 14px 10px;overflow-x:auto;scrollbar-width:none;min-width:0}
.blocks::-webkit-scrollbar{display:none}
.blk{flex:1;min-width:82px;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.4px;
 padding:9px 6px;border-radius:7px;background:var(--card2);color:var(--dim);cursor:pointer;transition:.15s}
.blk.on{background:var(--tx);color:#07141A}

.tools{padding:0 14px 10px}
.search{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;
 padding:10px 12px;color:var(--tx);font-size:14px;font-family:inherit}
.search::placeholder{color:var(--dim2)}
.filters{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.flt{font-size:11px;font-weight:700;padding:6px 11px;border-radius:20px;border:1px solid var(--line);
 color:var(--dim);background:transparent;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s}
.flt.on{background:var(--green);border-color:var(--green);color:#fff}

.acts{display:flex;gap:11px;padding:14px 14px 2px;align-items:center}
.act{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:14px 8px;
 color:var(--tx);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.act:active{border-color:var(--brass);color:var(--brass)}

/* --- tilkall servitør: roterende ring rundt en bjelle --- */
.bell{position:relative;width:88px;height:88px;flex:none;background:transparent;border:0;
 padding:0;cursor:pointer;font-family:inherit;display:block}
.bell .ring{position:absolute;inset:0;width:100%;height:100%;
 animation:spin 22s linear infinite;transform-origin:50% 50%}
.bell .ring text{fill:var(--brass);font-size:8.2px;font-weight:700;letter-spacing:2.6px;
 font-family:inherit;opacity:.85}
.bell .disc{position:absolute;inset:15px;border-radius:50%;border:1px solid var(--brass);
 background:radial-gradient(circle at 50% 40%,rgba(216,180,90,.16),transparent 70%);
 display:flex;align-items:center;justify-content:center;transition:.2s}
.bell .disc svg{width:26px;height:26px;fill:none;stroke:var(--brass);stroke-width:1.6;
 stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 12%}
.bell::after{content:"";position:absolute;inset:15px;border-radius:50%;
 border:1px solid var(--brass);opacity:0}
.bell:active .disc{background:rgba(216,180,90,.22)}
.bell.rang .disc svg{animation:swing .75s ease-in-out}
.bell.rang::after{animation:pulse .75s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swing{0%,100%{transform:rotate(0)}15%{transform:rotate(15deg)}
 35%{transform:rotate(-13deg)}55%{transform:rotate(9deg)}75%{transform:rotate(-5deg)}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.bell .ring{animation:none}}

.hero{margin:12px 14px 0;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:14px 15px}
.hero b{color:var(--brass);font-family:Georgia,serif;font-size:15px;font-weight:400;letter-spacing:.3px}
.hero p{color:var(--dim);font-size:12px;margin-top:6px;line-height:1.5}

/* --- toppbilde per fane --- */
.banner{position:relative;height:170px;overflow:hidden;margin:0 0 2px}
.banner img{width:100%;height:100%;object-fit:cover;display:block;
 filter:saturate(1.05) contrast(1.03)}
.banner .shade{position:absolute;inset:0;
 background:linear-gradient(180deg,rgba(7,20,26,.15) 0%,rgba(7,20,26,.55) 55%,var(--bg) 100%)}
.banner .cap{position:absolute;left:16px;right:16px;bottom:13px}
.banner .cap b{display:block;font-family:Georgia,serif;font-size:22px;font-weight:400;
 color:#fff;letter-spacing:.5px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.banner .cap span{display:block;font-size:11px;color:#CFE0E4;margin-top:3px;
 text-shadow:0 1px 6px rgba(0,0,0,.7)}
/* --- forslagsrader --- */
.sugbox{margin:14px 14px 2px;background:#1A1408;border:1px solid #6A5320;border-radius:10px;
 padding:11px 13px;font-size:11.5px;color:#E4CE93;line-height:1.5}
.item.sug{opacity:.92}
.tag{display:inline-block;font-size:8.5px;letter-spacing:1.1px;font-weight:800;
 color:#07141A;background:var(--brass);border-radius:3px;padding:2px 5px;margin-left:7px;
 vertical-align:2px}
.dash{font-family:Georgia,serif;font-size:15px;color:#4E6771}
/* --- lightbox --- */
.lb{position:fixed;inset:0;background:rgba(3,10,13,.94);z-index:120;display:none;
 align-items:center;justify-content:center;padding:18px;cursor:zoom-out}
.lb.open{display:flex}
.lb figure{margin:0;max-width:100%;text-align:center}
.lb img{max-width:100%;max-height:74vh;border-radius:12px;display:block}
.lb figcaption{color:#CFE0E4;font-size:13px;margin-top:12px;font-family:Georgia,serif}
.sec{padding:20px 14px 4px}
.sec h2{font-family:Georgia,serif;font-size:19px;font-weight:400;color:var(--brass);letter-spacing:.4px}
.hairline{height:1px;background:var(--line);margin:10px 14px 0}

.item{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid #0C1D24;align-items:flex-start}
.thumb{width:86px;height:86px;border-radius:10px;flex:none;position:relative;overflow:hidden;
 background:linear-gradient(140deg,#16323C,#0E2029);cursor:zoom-in}
.thumb::after{content:"";position:absolute;inset:0;border-radius:10px;
 box-shadow:inset 0 0 0 1px rgba(216,180,90,.22)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-size:7px;letter-spacing:1.2px;color:#4A6570}
.thumb .illu{position:absolute;left:0;right:0;bottom:0;padding:2px 3px;font-size:6.5px;
 letter-spacing:.3px;text-align:center;line-height:1.2;background:rgba(0,0,0,.6);color:#fff}
.ib{flex:1;min-width:0}
.iname{font-size:15px;font-weight:700;line-height:1.25}
.idesc{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.4}
.ialt{font-size:11px;color:var(--dim2);margin-top:3px;line-height:1.3}
.ialt b{color:#5A737C;font-size:8.5px;letter-spacing:.8px;margin-right:3px}
.ialg{font-size:10px;color:#587079;margin-top:6px}
.iright{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.price{font-family:Georgia,serif;font-size:15px;color:var(--brass);white-space:nowrap}
.add{width:31px;height:31px;border-radius:50%;border:1px solid var(--brass);background:transparent;
 color:var(--brass);font-size:19px;line-height:0;cursor:pointer;font-family:inherit;
 display:flex;align-items:center;justify-content:center;padding-bottom:2px}
.add:active{background:var(--brass);color:#07141A}
.qty{display:flex;align-items:center;gap:9px}
.qty button{width:26px;height:26px;border-radius:50%;border:0;background:var(--card2);color:var(--tx);
 font-size:16px;line-height:0;cursor:pointer;font-family:inherit}
.qty b{font-size:14px;min-width:14px;text-align:center}
.units{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.unit{font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:6px;border:1px solid var(--line);
 background:transparent;color:var(--dim);cursor:pointer;font-family:inherit}
.unit:active{border-color:var(--brass);color:var(--brass)}

.legendbox{margin:16px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.legendbox h4{font-family:Georgia,serif;font-weight:400;color:var(--brass);font-size:14px;margin-bottom:8px}
.legendbox .lg2{display:flex;flex-wrap:wrap;gap:5px}
.lchip{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:4px 9px}
.lchip i{color:var(--brass);font-style:normal;font-weight:800;margin-right:4px}
.legendbox p{color:var(--dim2);font-size:10.5px;margin-top:9px;line-height:1.45}

/* --- status for gjestens egen bestilling, alltid synlig etter at den er sendt --- */
.mine{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
 background:var(--deep);border-top:1px solid var(--brass);padding:11px 16px;display:none;
 align-items:center;justify-content:space-between;gap:10px;cursor:pointer;z-index:58}
.mine.show{display:flex}
.mine .ml{min-width:0}
.mine .mt{font-size:12.5px;font-weight:700;color:var(--brass)}
.mine .ms{font-size:10.5px;color:var(--dim);margin-top:2px;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.mine .mr{font-family:Georgia,serif;font-size:14px;color:var(--tx);white-space:nowrap}
.mine .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brass);
 margin-right:5px;vertical-align:1px;animation:blip 1.6s ease-in-out infinite}
.mine.done .dot{background:var(--green);animation:none}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
body.hasmine .cartbar{bottom:118px}
.cartbar{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
 background:var(--brass);color:#07141A;padding:14px 16px;display:none;
 align-items:center;justify-content:space-between;cursor:pointer;z-index:60}
.cartbar.show{display:flex}
.cartbar .cl{font-weight:800;font-size:14px}
.cartbar .cr{font-family:Georgia,serif;font-size:16px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:90;display:none}
.sheet-bg.open{display:block}
.sheet,.drawer{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
 background:var(--card);border-radius:16px 16px 0 0;z-index:95;padding:16px 16px 24px;
 display:none;max-height:82vh;overflow:auto;border-top:1px solid var(--line)}
.sheet.open,.drawer.open{display:block}
.sheet h3,.drawer h3{font-family:Georgia,serif;font-weight:400;font-size:17px;margin-bottom:4px}
.sheet p.sh{color:var(--dim);font-size:12.5px;margin-bottom:12px}
.langrow{display:flex;align-items:center;justify-content:space-between;padding:12px;
 background:var(--card2);border-radius:9px;margin-bottom:7px;cursor:pointer;border:1px solid transparent}
.langrow.on{border-color:var(--brass)}
.langrow b{font-size:14.5px;font-weight:600}
.langrow span{color:var(--dim2);font-size:11.5px;display:block;margin-top:1px}
.langrow .ck{color:var(--brass);font-weight:800}
.soon{background:#152C22;border:1px dashed #2C5343;border-radius:9px;padding:12px;margin-top:10px}
.soon b{color:var(--brass);font-size:13px}
.soon p{color:var(--dim);font-size:11.5px;margin-top:4px;line-height:1.45}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;
 border-bottom:1px solid var(--line)}
.crow .cn{font-size:13.5px;font-weight:700}
.crow .cp{font-family:Georgia,serif;color:var(--brass);font-size:14px;white-space:nowrap}
.total{display:flex;justify-content:space-between;padding:14px 0 4px;font-size:17px;font-weight:800}
.total span:last-child{font-family:Georgia,serif;color:var(--brass)}
.btn{width:100%;background:var(--brass);color:#07141A;border:0;border-radius:10px;padding:14px;
 font-size:15px;font-weight:800;cursor:pointer;margin-top:12px;font-family:inherit}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);margin-top:8px}
.empty{color:var(--dim2);text-align:center;padding:26px 0;font-size:13.5px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--green);
 color:#fff;padding:12px 20px;border-radius:24px;font-size:13.5px;font-weight:700;z-index:120;
 opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1}
.fnote{padding:22px 16px 30px;color:#43585F;font-size:10.5px;line-height:1.55;
 border-top:1px solid var(--line);margin-top:20px}
.fnote b{color:var(--dim2)}

.demobar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
 background:#03090C;border-top:1px solid var(--line);display:flex;align-items:center;gap:5px;
 padding:7px 10px;z-index:80}
.dbtn{flex:1;text-align:center;font-size:10px;font-weight:800;letter-spacing:.7px;padding:9px 3px;
 border-radius:6px;background:transparent;color:var(--dim2);border:0;cursor:pointer;font-family:inherit}
.dbtn.on{background:var(--card2);color:var(--tx)}
.dsel{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:6px;
 padding:8px 6px;font-size:11px;font-family:inherit;flex:none}
.pane{padding:18px 14px 10px}
.pane h2{font-family:Georgia,serif;font-weight:400;font-size:21px;color:var(--brass)}
.pane p.ps{color:var(--dim);font-size:12.5px;margin-top:6px;line-height:1.45}
.fld{margin-top:12px}
.fld label{display:block;font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:var(--brass);margin-bottom:5px}
.fld input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;
 padding:11px 12px;color:var(--tx);font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.hint{font-size:10.5px;color:var(--dim2);margin-top:6px;word-break:break-all}
.hint b{color:var(--dim)}
.qrgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.qrcard{background:#fff;border-radius:8px;padding:12px 8px 10px;text-align:center;color:#07141A}
.qrcard .qc{display:flex;justify-content:center}
.qrcard .qn{font-family:Georgia,serif;font-size:24px;margin-top:6px;letter-spacing:2px}
.qrcard .qs{font-size:8px;color:#63747A;line-height:1.35;margin-top:2px}
.histhead{display:flex;align-items:baseline;gap:9px;margin-top:30px;padding-top:18px;
 border-top:1px solid var(--line)}
.histn{font-size:11px;font-weight:800;color:var(--dim2);background:var(--card2);
 border-radius:20px;padding:3px 9px}
.retain{margin-top:10px;font-size:10.5px;color:var(--dim2);border:1px dashed var(--line);
 border-radius:7px;padding:7px 10px;display:inline-block}
.ord{background:var(--card2);border-radius:10px;padding:12px 13px;margin-bottom:9px;border-left:3px solid var(--brass)}
.ord.done{opacity:.45;border-left-color:var(--green)}
.ordh{display:flex;justify-content:space-between;align-items:baseline}
.ordh b{font-size:14px}
.ordh span{font-size:10.5px;color:var(--dim2)}
.ordl{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
.ordf{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.ordf .op{font-family:Georgia,serif;color:var(--brass);font-size:14px}
.ordf button{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:6px;
 padding:6px 11px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
@media print{
 body{background:#fff}
 .top,.demobar,.cartbar,#hero,.acts,.fld,.hint,.btn,.fnote,.pane p.ps,.pane h2,.noprint{display:none!important}
 #app{max-width:none;box-shadow:none;background:#fff;padding:0}
 .qrgrid{grid-template-columns:repeat(3,1fr);gap:8mm}
 .qrcard{border:1px solid #ddd;break-inside:avoid}
}
</style>
</head>
<body>
<div id="app">
 <div class="top">
  <div class="row1">
   <div class="brand">SOLSIDEN<small>Akershusstranda 13 · Oslo</small></div>
   <div class="table-pill" id="tablePill">Bord 11</div>
  </div>
  <div class="langs" id="langs"></div>
  <div class="blocks" id="blocks"></div>
  <div class="tools">
   <input class="search" id="search" placeholder="Søk…">
   <div class="filters" id="filters"></div>
  </div>
 </div>
 <div id="hero"></div>
 <div id="list"></div>
 <div class="fnote" id="fnote"></div>
</div>
<div class="demobar" id="demobar"></div>
<div class="mine" id="mine"></div>
<div class="cartbar" id="cartbar"><span class="cl" id="cartL"></span><span class="cr" id="cartR"></span></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb"><figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

/* ---------------------------------------------------------------------------
   BESTILLINGSHISTORIKK

   lastes på nytt. Etter det faller de ut av seg selv. Endre tallet her.
--------------------------------------------------------------------------- */
const RETENTION_H = 48;
const LSKEY = "solsiden.orders.v1";

function prune(list){
  const cut = Date.now() - RETENTION_H * 3600 * 1000;
  return list.filter(o => (o.ts || 0) > cut);
}
function loadOrders(){
  try { return prune(JSON.parse(localStorage.getItem(LSKEY) || "[]")); }
  catch(e){ return []; }            /* uten lagring virker alt som før, i minnet */
}
function saveOrders(){
  try { localStorage.setItem(LSKEY, JSON.stringify(orders)); } catch(e){}
}
function stamp(ts){
  const d = new Date(ts), n = new Date();
  const hm = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  const day = x => x.getFullYear()+"-"+x.getMonth()+"-"+x.getDate();
  const y = new Date(n.getTime() - 86400000);
  if (day(d) === day(n)) return t().today + " " + hm;
  if (day(d) === day(y)) return t().yday + " " + hm;
  return String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + ". " + hm;
}

function drawQR(){

  if(typeof QRCode==="undefined"){g.innerHTML=`<div class="empty" style="grid-column:1/-1">${t().offline}</div>`;return}
  for(let i=1;i<=nTables;i++){
    const c=document.createElement("div"); c.className="qrcard";

    const n=document.createElement("div"); n.className="qn"; n.textContent=String(i).padStart(2,"0");
    const s=document.createElement("div"); s.className="qs"; s.innerHTML=t().scan+"<br>"+UI.no.scan;
    c.appendChild(n); c.appendChild(s); g.appendChild(c);
    new QRCode(h,{text:qrLink(i),width:110,height:110,colorDark:"#07141A",colorLight:"#FFFFFF",
                  correctLevel:QRCode.CorrectLevel.M});
  }
}
